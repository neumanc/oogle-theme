name: Release

# Tag vX.Y.Z on main → build the production zip reproducibly with git archive
# (dev files excluded by .gitattributes export-ignore), attach it and its
# SHA-256 to a GitHub Release. inc/updates.php on client sites picks up the
# release's oogle-theme.zip asset.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag matches style.css
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(grep -E '^Version:' style.css | awk '{print $2}')"
          echo "tag=$TAG style.css=$VER"
          [ "$TAG" = "$VER" ] || (echo 'style.css Version does not match the tag' && exit 1)
          grep -qE "^## \[$TAG\]" CHANGELOG.md || (echo "CHANGELOG.md has no [$TAG] section" && exit 1)

      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build archive
        run: |
          git archive --format=zip --prefix=oogle-theme/ "$GITHUB_REF_NAME" -o oogle-theme.zip
          sha256sum oogle-theme.zip > oogle-theme.zip.sha256
          unzip -l oogle-theme.zip
          cat oogle-theme.zip.sha256

      - name: Extract release notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v tag="$TAG" '/^## \[/{p = index($0, "[" tag "]") > 0; if (!p && found) exit; if (p) found = 1} p' CHANGELOG.md > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: |
            oogle-theme.zip
            oogle-theme.zip.sha256
