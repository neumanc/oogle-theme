name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks out and lints.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: PHP syntax
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Install coding-standards tooling (dev only)
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --quiet \
            wp-coding-standards/wpcs:^3.1 \
            phpcompatibility/phpcompatibility-wp:^2.1 \
            dealerdirect/phpcodesniffer-composer-installer:^1.0

      - name: PHPCS (WordPress Coding Standards)
        # phpcs.xml.dist prints progress (-p), which would corrupt a piped checkstyle report; the exit code gates the job.
        run: ~/.composer/vendor/bin/phpcs --standard=phpcs.xml.dist

      - name: PHPCompatibility 8.4+
        run: ~/.composer/vendor/bin/phpcs --standard=PHPCompatibilityWP --runtime-set testVersion 8.4- --extensions=php -p .

      - name: JSON
        run: |
          for f in theme.json styles/*.json; do jq -e . "$f" >/dev/null && echo "ok $f"; done

      - name: JavaScript modules parse
        run: |
          for f in assets/js/*.js; do cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs && echo "ok $f"; done

      - name: No client-specific strings in the parent
        run: |
          ! grep -rniE 'precision|precisionkb|kissimmee|gohighlevel' --exclude-dir=.git --exclude-dir=.github . || (echo 'Client-specific reference found in the parent theme' && exit 1)

  package:
    name: Build release archive (dry run)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: git archive
        run: |
          git archive --format=zip --prefix=oogle-theme/ HEAD -o oogle-theme.zip
          unzip -l oogle-theme.zip
          ! unzip -l oogle-theme.zip | grep -E 'docs/|tools/|tests/|\.github/|phpcs\.xml|AGENTS\.md' || (echo 'Dev files leaked into the archive' && exit 1)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oogle-theme-dry-run
          path: oogle-theme.zip
          retention-days: 7
