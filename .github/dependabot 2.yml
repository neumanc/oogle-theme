# Keep the SHA-pinned GitHub Actions in .github/workflows current. The theme
# itself has no runtime dependencies (no Composer, no npm), so this is the
# only ecosystem to watch; Dependabot proposes the new commit SHA and version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
